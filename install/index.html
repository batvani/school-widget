<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>School Widget</title>
<style>
:root{color-scheme:dark light}
body{margin:0;padding:24px 16px;font:17px/1.4 -apple-system,system-ui,sans-serif;background:#000;color:#fff}
@media (prefers-color-scheme:light){body{background:#f2f2f7;color:#000}}
main{max-width:420px;margin:0 auto}
a{color:#30d158}
button{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:#30d158;color:#000;font:inherit;font-weight:600;margin:16px 0}
[hidden]{display:none!important}
button{transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,filter .2s,background-color .2s}
@media (hover:hover) and (pointer:fine){button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 8px 24px rgba(48,209,88,.35)}}
button:active{transform:scale(.95);transition-duration:.08s;filter:brightness(.92)}
@media (prefers-reduced-motion:reduce){button:hover,button:active{transform:none!important}*{transition:filter .2s,background-color .2s!important}}
</style>
</head>
<body>
<main>
<p id="msg">One moment…</p>
<div id="bad" hidden>
<h1>This link is broken</h1>
<p>The chat app probably cut it short. Copy the whole link again, or make the timetable again on the <a id="tt">School Widget page</a>.</p>
</div>
</main>
<script>
(function () {
  "use strict";
  var base = location.href.replace(/[?#].*$/, ""), SITE = base.replace(/install\/?[^\/]*$/, "");
  var go = window.__go || function (u) { location.replace(u); };
  var m = /^#(z|d)=([\w-]+)$/.exec(location.hash), $ = function (id) { return document.getElementById(id); };
  $("tt").href = SITE + "#timetable";
  function bad() { $("msg").hidden = true; $("bad").hidden = false; }
  if (!m) return go(SITE + "#install");
  var kind = m[1], data = m[2];
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function check() {
    try {
      var a = b64(data);
      if (kind === "d") return Promise.resolve(JSON.parse(new TextDecoder().decode(a)));
      var s = new Blob([a]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(s).text().then(JSON.parse);
    } catch (e) { return Promise.reject(e); }
  }
  function jump() {
    var u = "https://open.scriptable.app/run/School%20Widget?data=" + encodeURIComponent("school-widget:" + kind + ":" + data);
    if (window.__go) go(u); else location.href = u;
  }
  check().then(function (t) {
    if (!t || typeof t !== "object") throw 0;
    $("msg").textContent = "Opening School Widget…";
    var b = document.createElement("button"); b.id = "open"; b.textContent = "Open in School Widget"; b.onclick = jump; document.querySelector("main").appendChild(b);
    jump();
    setTimeout(function () {
      if (!document.hidden) go(SITE + "#install&" + kind + "=" + data);
    }, 2000);
  }).catch(bad);
})();
</script>
</body>
</html>
